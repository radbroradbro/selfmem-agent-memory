name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm exec --yes --package=pnpm@10.23.0 -- pnpm install --frozen-lockfile

      - name: Test
        run: npm exec --yes --package=pnpm@10.23.0 -- pnpm test

      - name: Full smoke
        run: npm exec --yes --package=pnpm@10.23.0 -- pnpm smoke

      - name: Release readiness check
        run: npm exec --yes --package=pnpm@10.23.0 -- pnpm release:check
